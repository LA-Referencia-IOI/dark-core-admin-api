x-admin-api-build: &admin-api-build
  context: ../..
  dockerfile: services/dark-core-admin-api/Dockerfile

services:
  admin-api:
    build: *admin-api-build
    ports:
      - "8000:8000"
    env_file:
      - .env.integration
    environment:
      - DARK_RPC_URL=http://rpc01:8545
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - dark-net

networks:
  dark-net:
    external: true
    name: dark-net
